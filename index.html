<script>
(()=>{const $=i=>document.getElementById(i);const cv=$('c'),ctx=cv.getContext('2d');let W,H,D;

let tq=[],tOn=false;function toast(m){tq.push(m);if(!tOn)nextT()}function nextT(){const m=tq.shift();if(!m){tOn=false;return}tOn=true;const t=$('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>{t.style.opacity=0;setTimeout(nextT,450)},2000)}

function shop(){$('bank2').textContent=bank;const mk=(arr,k,eq,g)=>{g.innerHTML='';arr.forEach(s=>{const d=document.createElement('div');const own=owned[k].includes(s.id);d.className='it'+(eq===s.id?' eq':'');d.innerHTML=(k==='bg'?'<div class="e" style="height:40px;border-radius:8px;background:linear-gradient('+s.c[0]+','+s.c[1]+')"></div>':'<div class="e">'+s.e+'</div>')+'<div>'+s.n+'</div>';const b=document.createElement('button');if(eq===s.id){b.textContent='Seçili';b.disabled=true}else if(own){b.textContent='Seç';b.onclick=()=>{if(k==='sk')eqSk=s.id;else eqBg=s.id;save();shop()}}else{b.textContent='💰 '+s.p;b.disabled=bank<s.p;b.onclick=()=>{if(bank<s.p)return;bank-=s.p;owned[k].push(s.id);if(k==='sk')eqSk=s.id;else eqBg=s.id;snd(880,.2,'triangle');toast('🛍️ '+s.n+' alındı!');save();shop()}}d.appendChild(b);g.appendChild(d)})};mk(SKINS,'sk',eqSk,$('gSk'));mk(BGS,'bg',eqBg,$('gBg'))}
function mis(){const l=$('lMis');l.innerHTML='';MISSIONS.forEach(m=>{const v=Math.min(m.t(),m.g),dn=doneM.includes(m.id);const d=document.createElement('div');d.className='ms';d.innerHTML=(dn?'✅ ':'⬜ ')+'<b>'+m.n+'</b> <span style="float:right;opacity:.7">'+v+'/'+m.g+' · +'+m.xp+' XP</span><div class="bar"><i style="width:'+(100*v/m.g)+'%"></i></div>';l.appendChild(d)})}
function bad(){const g=$('gBad');g.innerHTML='';MISSIONS.forEach(m=>{const dn=doneM.includes(m.id);const d=document.createElement('div');d.className='it'+(dn?' eq':'');d.innerHTML='<div class="e" style="'+(dn?'':'filter:grayscale(1);opacity:.35')+'">'+BADGE[m.id]+'</div><div>'+m.n+'</div><div style="opacity:.7">'+(dn?'Kazanıldı':'Kilitli')+'</div>';g.appendChild(d)})}
$('bShop').onclick=()=>show('shop');$('bMis').onclick=()=>show('mis');$('bBad').onclick=()=>show('bad');$('bMenu').onclick=()=>show('start');
// game
const COINS=['🪙','🐸','🐶','◎'];let items,parts,floats,px,tx,score,lives,run=false,t0,last,spawnT,inv,shake,combo,streak,pw,phase,phaseT,banner,clean,caught,goldsG,pupsG,bestComboG;
const mult=()=>Math.min(5,1+Math.floor(streak/5));
function reset(){items=[];parts=[];floats=[];px=tx=W/2;score=0;lives=3;t0=performance.now();last=t0;spawnT=0;inv=0;shake=0;streak=0;pw={mag:0,shield:0,x2:0};phase='bull';phaseT=0;banner={t:'Boğa Piyasası 🐂',a:2.5};clean=0;caught=0;goldsG=0;pupsG=0;bestComboG=1}
function start(){reset();run=true;show(null);snd(523,.12);snd(784,.18,'sine',.12);requestAnimationFrame(loop)}
$('bStart').onclick=start;$('bAgain').onclick=start;
function mv(e){const t=e.touches?e.touches[0]:e;tx=t.clientX}
addEventListener('touchstart',mv,{passive:true});addEventListener('touchmove',e=>{if(run)e.preventDefault();mv(e)},{passive:false});addEventListener('mousemove',e=>{if(run)mv(e)});
function spawn(sp){const r=Math.random(),bull=phase==='bull';const bombP=bull?.16:.34,puP=.035;let k;if(r<puP)k=['mag','shield','x2'][Math.random()*3|0];else if(r<puP+bombP)k='bomb';else if(r<puP+bombP+.06)k='gold';else k='coin';

function burst(x,y,c,n=12){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,c})}}

function loop(now){if(!run)return;const dt=Math.min(50,now-last)/16.67,el=(now-t0)/1000,dts=dt/60;last=now;
phaseT+=dts;if(phaseT>30){phaseT=0;phase=phase==='bull'?'bear':'bull';banner={t:phase==='bull'?'Boğa Piyasası 🐂':'Ayı Piyasası 🐻',a:2.5};snd(phase==='bull'?660:220,.4,'triangle',.12)}

if(pw.mag>0&&(o.k==='coin'||o.k==='gold')&&o.y>0){o.x+=(px-o.x)*.08*dt;o.y+=(wy-o.y)*.02*dt}

if(o.k==='bomb'){if(pw.shield>0){pw.shield=0;burst(o.x,o.y,'#7fd4ff',18);fl(o.x,o.y,'🛡️ Engellendi!','#7fd4ff');snd(300,.25,'triangle',.15,600)}else if(inv<=0){lives--;streak=0;clean=0;inv=60;shake=14;burst(o.x,o.y,'#ff4d6d',22);fl(o.x,o.y,'RUG! -1 ❤️','#ff4d6d');snd(140,.4,'sawtooth',.2,50);if(navigator.vibrate)navigator.vibrate(120);if(lives<=0){end();return}}}
else if(o.k==='coin'||o.k==='gold'){streak++;const m=mult();if(m>bestComboG)bestComboG=m;const base=o.k==='gold'?50:10,v=base*m*(pw.x2>0?2:1);score+=v;caught++;if(o.k==='gold')goldsG++;burst(o.x,o.y,o.k==='gold'?'#ffd84d':'#14f195',o.k==='gold'?18:8);fl(o.x,o.y,'+'+v+(m>1?' x'+m:''),o.k==='gold'?'#ffd84d':'#fff');snd(o.k==='gold'?988:660+m*60,.12,'triangle',.12,o.k==='gold'?1568:990);if(streak%5===0&&m<=5&&streak<=25)fl(px,wy-50,'KOMBO x'+m+'!','#ff9f1c')}
else{pupsG++;if(o.k==='mag'){pw.mag=8;fl(o.x,o.y,'🧲 Mıknatıs!','#ff7ad9')}if(o.k==='shield'){pw.shield=1;fl(o.x,o.y,'🛡️ Kalkan!','#7fd4ff')}if(o.k==='x2'){pw.x2=10;fl(o.x,o.y,'✨ 2x Puan!','#ffd84d')}burst(o.x,o.y,'#fff',14);snd(784,.25,'sine',.15,1568)}continue}
if(o.y>H+30){items.splice(i,1);if(o.k==='coin'||o.k==='gold'){if(streak>=5)fl(o.x,H-40,'Kombo bitti','#aaa');streak=0}}}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.15*dt;p.l-=.03*dt;if(p.l<=0)parts.splice(i,1)}

ctx.restore()}
